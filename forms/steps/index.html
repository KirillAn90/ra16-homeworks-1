<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер активности</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Трекер активности</h1>
        
        <!-- Форма добавления данных -->
        <form id="addForm">
            <div class="form-group">
                <label for="dateInput">Дата: (ДД.ММ.ГГ)</label>
                <input type="date" id="dateInput" required>
            </div>
            <div class="form-group">
                <label for="kmInput">Пройдено км:</label>
                <input type="number" step="0.1" id="kmInput" required>
            </div>
            <button type="submit">Добавить</button>
        </form>
        
        <!-- Таблица данных -->
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Дата (ДД.ММ.ГГ)</th>
                    <th>Пройдено км</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут здесь -->
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
