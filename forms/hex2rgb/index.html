<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX to RGB Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="input-wrapper">
            <input type="text" id="hex" placeholder="#FFFFFF">
        </div>
        
        <div class="result-wrapper">
            <div class="output-wrapper" id="rgb-container">
                <div id="rgb"></div>
            <div id="error" class="hidden">Ошибка!</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
